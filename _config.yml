title: Tyson Chae
tagline: "feat: notes from building software with people"
description: >-
  Notes from inside a dev team — process, culture, incidents,
  retros, and the messy parts of building software with people.
url: "https://tysonchae.github.io"
author: Tyson Chae

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap

defaults:
  - scope:
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
